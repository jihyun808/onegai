services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-karaokedayo}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-karaokedayo}
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD:-karaokedayo}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:8-alpine
    command: redis-server --save '' --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    command: python run.py
    ports:
      - '5001:5001'
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-karaokedayo}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-karaokedayo}
      REDIS_HOST: redis
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./server:/app
      - /app/__pycache__
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  client:
    build: ./client
    profiles: ['client']
    ports:
      - '5173:5173'
    environment:
      VITE_PROXY_TARGET: http://server:5001
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  mysql-data:
